# Rebuilds the site every Monday so that batches in data/ready.json whose "from" date has come
# become indexable (robots tag removed, added to the sitemap). Can also be run by hand from the Actions tab.
name: Weekly rebuild
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python3 build.py
      - name: Publish if anything changed
        run: |
          git config user.name "sapiopedia-weekly"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Weekly rebuild: publish scheduled batches" && git push)
